[project]
name = "mcp-fileencoding"
version = "0.1.0"
description = "MCP 服务器，解决 AI 编码助手在 Windows 下读写 GBK/GB18030 等非 UTF-8 文件时乱码的问题"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "charset-normalizer>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
